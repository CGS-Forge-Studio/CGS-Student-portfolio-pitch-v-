services:
  postgres:
    image: postgres:16-alpine
    container_name: cgs-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cgs_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cgs_hub_data:/var/lib/postgresql/data

volumes:
  cgs_hub_data:
